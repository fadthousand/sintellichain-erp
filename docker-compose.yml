services:
  # 1. Odoo Core Primary Transactional Database
  db:
    image: postgres:15-alpine
    container_name: sintellichain-postgres
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_password
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sintellichain-net
    restart: unless-stopped

  # 2. Odoo Community Edition
  odoo:
    image: odoo:17.0
    container_name: sintellichain-odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_password
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
    networks:
      - sintellichain-net
    restart: unless-stopped

  # 3. IoT Cold Chain Temperature Log Time-Series Database
  mongodb:
    image: mongo:6.0
    container_name: sintellichain-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root_password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sintellichain-net
    restart: unless-stopped

  # 4. Message Broker Ingestion Stream for Downstream POS/Cashier Systems (Official Apache Kafka)
  kafka:
    image: apache/kafka:latest
    container_name: sintellichain-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sintellichain-net
    restart: unless-stopped

volumes:
  pg_data:
  odoo_data:
  mongo_data:
  kafka_data:

networks:
  sintellichain-net:
    driver: bridge
